[project]
name = "lexicore"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ismail-ashraf", email = "iismmail23@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "mlflow>=3.16.0",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "pymupdf>=1.28.2",
    "pytesseract>=0.3.13",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "regex>=2026.7.19",
    "scikit-learn>=1.9.0",
    "torch>=2.13.0",
    "unstructured[pdf]>=0.27.1",
    "uvicorn>=0.52.4",
]

[project.scripts]
lexicore = "lexicore:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]
