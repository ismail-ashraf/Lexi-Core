[project]
name = "lexicore"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ismail-ashraf", email = "iismmail23@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.1.0",
    "alembic>=1.19.2",
    "bitsandbytes>=0.50.2",
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "gliner>=0.2.29",
    "groq>=1.7.0",
    "langchain-text-splitters>=1.1.3",
    "mlflow>=3.16.0",
    "numpy>=2.5.2",
    "onnxruntime>=1.29.0",
    "pandas>=3.0.5",
    "pdf2image>=1.17.0",
    "pdfminer>=20191125",
    "pdfminer-six>=20260107",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.16.1",
    "pymupdf>=1.28.2",
    "pytesseract>=0.3.13",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "regex>=2026.7.19",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=6.2.0",
    "sentencepiece>=0.2.2",
    "sqlalchemy>=2.0.52",
    "tiktoken>=0.14.0",
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "torchvision==0.26.0",
    "unstructured",
    "uvicorn>=0.52.4",
]

[project.scripts]
lexicore = "lexicore:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
